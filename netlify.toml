[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Per-variable scope editing (removing "Builds" from server-only secrets)
  # requires a paid Netlify plan, so these can't be scoped away from the
  # build environment on the current plan. They're omitted from secrets
  # scanning instead. This is safe specifically because these values are
  # only ever imported inside netlify/functions/lib/*.ts (server-side) —
  # nothing in src/ (the browser bundle) references them. Verify that
  # invariant holds before adding anything else to this list: a real
  # secret that IS reachable from src/ must never be added here — fix the
  # code instead.
  #
  # ALPACA_BASE_URL is additionally just a public API endpoint, not a
  # secret at all.
  SECRETS_SCAN_OMIT_KEYS = "ALPACA_BASE_URL,ALPACA_API_KEY_ID,ALPACA_API_SECRET_KEY,SUPABASE_SERVICE_ROLE_KEY,DISCORD_WEBHOOK_URL,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,FMP_API_KEY,DOLTHUB_TOKEN"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  publish = "dist"
  autoLaunch = false

# SPA fallback so client-side routing (e.g. /symbol/AAPL) works on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Scheduled functions (Netlify cron). Times are UTC.
# eod-scan:           NOT here — runs via launchd on the Mac mini at 17:45
#                     ET / 21:45 UTC (see the note lower down).
# intraday-scan:      every 10 minutes during roughly 13:00-21:00 UTC (US
#                     market hours), Mon-Fri — technical triggers on the
#                     momentum-filtered candidate set only.
# intraday-bars-scan: every 5 minutes, 13:00-23:55 UTC (regular session +
#                     most of after-hours) — populates bars_intraday (the
#                     "Day" chart range) for the whole active universe, not
#                     just candidates. Separate cadence/scope/window from
#                     intraday-scan on purpose (see the function's comment).
# Netlify cron does not support "only during market hours" natively beyond
# the hour range below; intraday-scan also no-ops outside market hours as
# a safety check (intraday-bars-scan just returns whatever the date has,
# which is empty outside trading hours anyway — harmless, not worth an
# extra guard).
# backfill-history and backtest-triggers are both intentionally NOT
# scheduled — one-time/as-needed manual calls (see each function's own
# comment), not recurring jobs. Re-run backtest-triggers whenever a
# trigger's definition or the factor computation in dailySnapshot.ts
# changes, so trigger_stats keeps reflecting what the triggers actually do.
#
# prune-bars-intraday / prune-trigger-evaluations / prune-bars-daily:
# once daily, ~22:20 UTC — rolling retention on the tables that would
# otherwise grow unbounded (see each function's own comment). Moved off
# 21:45 UTC: that collided with the launchd eod-scan (17:45 ET / 21:45
# UTC), and the prunes' large DELETEs saturated the free-tier DB enough
# that eod-scan's first query got a fast 504 ("Gateway Timeout") and the
# whole run aborted in ~5s. eod-scan finishes by ~21:50; prune after.
# weekly-bars-scan: once weekly (Monday mornings) — aggregates bars_daily
# into bars_weekly for longer-term trend context.
#
# eod-scan is NOT scheduled here. At the ~5,000-symbol universe it runs
# well past Netlify's ~3-4 min platform timeout — it runs via launchd on
# the always-on worker host instead (scripts/run-eod-scan.sh,
# scripts/launchd/com.stackslash.eod-scan.plist). Still callable manually
# as a function (onboard-symbol invokes it in-process for one symbol).
# ---------------------------------------------------------------------------
[functions."intraday-scan"]
  schedule = "*/10 13-20 * * 1-5"

# 13:00-23:55 UTC = 9:00 AM - ~6:55 PM ET in EDT (an hour earlier in EST):
# regular session plus most of after-hours, so the dashboard's "as of"
# stamp keeps advancing into the evening instead of freezing at ~4:50 PM.
# Premarket (4:00-9:00 AM ET) is still not covered — thin penny-stock
# prints, not worth the extra Alpaca load.
[functions."intraday-bars-scan"]
  schedule = "*/5 13-23 * * 1-5"

# manage-positions: every 5 min during market hours — the exit half of the
# flip pipeline. Walks open 'flip' shadow_positions against profit-target /
# trailing / hard / time stops and fires a momentum_exit event on a close.
[functions."manage-positions"]
  schedule = "*/5 13-20 * * 1-5"

# intraday-factors-scan: every 5 min during market hours — computes live
# session-shape factors (RVOL, VWAP, gap, opening range) for the tradeable
# band into intraday_factor_state. Read by the Phase 3 fast triggers.
[functions."intraday-factors-scan"]
  schedule = "*/5 13-20 * * 1-5"

# intraday-flip-scan: every 5 min, offset +2 min so it reads fresh
# intraday_factor_state. Evaluates the enabled fast flip triggers.
[functions."intraday-flip-scan"]
  schedule = "2-59/5 13-20 * * 1-5"

# refresh-intraday-volume-profile: nightly, after the intraday jobs stop —
# EWMA-accumulates the per-minute volume profile that RVOL divides by.
[functions."refresh-intraday-volume-profile"]
  schedule = "35 23 * * 1-5"

[functions."prune-bars-intraday"]
  schedule = "20 22 * * 1-5"

[functions."prune-trigger-evaluations"]
  schedule = "20 22 * * 1-5"

[functions."prune-bars-daily"]
  schedule = "25 22 * * 1-5"

[functions."fundamentals-sync"]
  schedule = "0 6,21 * * *"

[functions."weekly-bars-scan"]
  schedule = "0 6 * * 1"

# refresh-window-stats: 23:00 UTC weekdays (~6-7pm ET) — after eod-scan
# has upserted the day's bars_daily. Rebuilds factor_window_stats, the
# trailing-window metric table the Isolator screener reads.
[functions."refresh-window-stats"]
  schedule = "0 23 * * 1-5"

# record-fire-outcomes: 23:10 UTC weekdays — after eod-scan's bars_daily
# upsert. Fills fire_outcomes (realized forward return of every promoted
# entry trigger_event) — the live counterpart to backtest-triggers.
[functions."record-fire-outcomes"]
  schedule = "10 23 * * 1-5"
