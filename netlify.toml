[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # ALPACA_BASE_URL is a public API endpoint, not a secret — omit it from
  # secrets scanning so it doesn't false-positive against .env.example or
  # any other repo file that documents it. Do NOT add ALPACA_API_KEY_ID /
  # ALPACA_API_SECRET_KEY / SUPABASE_SERVICE_ROLE_KEY / any real secret
  # here — those should stay scanned, and should also have "Builds" scope
  # removed in the Netlify UI (Site settings > Environment variables) since
  # they're only used server-side inside netlify/functions, never during
  # the Vite build.
  SECRETS_SCAN_OMIT_KEYS = "ALPACA_BASE_URL"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  publish = "dist"
  autoLaunch = false

# SPA fallback so client-side routing (e.g. /symbol/AAPL) works on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Scheduled functions (Netlify cron). Times are UTC.
# eod-scan:      21:30 UTC ~ 30 min after US market close (16:00 ET / 20:00 UTC,
#                adjust for DST as needed), Mon-Fri.
# intraday-scan: every 10 minutes during roughly 13:30-20:15 UTC (US market hours),
#                Mon-Fri. Netlify cron does not support "only during market hours"
#                natively beyond the hour range below; the function itself also
#                no-ops outside market hours as a safety check.
# ---------------------------------------------------------------------------
[functions."eod-scan"]
  schedule = "30 21 * * 1-5"

[functions."intraday-scan"]
  schedule = "*/10 13-20 * * 1-5"
