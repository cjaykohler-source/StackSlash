[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Per-variable scope editing (removing "Builds" from server-only secrets)
  # requires a paid Netlify plan, so these can't be scoped away from the
  # build environment on the current plan. They're omitted from secrets
  # scanning instead. This is safe specifically because these values are
  # only ever imported inside netlify/functions/lib/*.ts (server-side) —
  # nothing in src/ (the browser bundle) references them. Verify that
  # invariant holds before adding anything else to this list: a real
  # secret that IS reachable from src/ must never be added here — fix the
  # code instead.
  #
  # ALPACA_BASE_URL is additionally just a public API endpoint, not a
  # secret at all.
  SECRETS_SCAN_OMIT_KEYS = "ALPACA_BASE_URL,ALPACA_API_KEY_ID,ALPACA_API_SECRET_KEY,SUPABASE_SERVICE_ROLE_KEY,DISCORD_WEBHOOK_URL,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  publish = "dist"
  autoLaunch = false

# SPA fallback so client-side routing (e.g. /symbol/AAPL) works on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Scheduled functions (Netlify cron). Times are UTC.
# eod-scan:      21:30 UTC ~ 30 min after US market close (16:00 ET / 20:00 UTC,
#                adjust for DST as needed), Mon-Fri.
# intraday-scan: every 10 minutes during roughly 13:30-20:15 UTC (US market hours),
#                Mon-Fri. Netlify cron does not support "only during market hours"
#                natively beyond the hour range below; the function itself also
#                no-ops outside market hours as a safety check.
# backfill-history is intentionally NOT scheduled — it's a one-time/as-
# needed manual call (see the function's own comment), not a recurring job.
# The "Day" chart range (intraday bars) is deferred — no scheduled job for
# it yet; see the range-toggle UI's empty-state handling in SymbolDetail.tsx.
# ---------------------------------------------------------------------------
[functions."eod-scan"]
  schedule = "30 21 * * 1-5"

[functions."intraday-scan"]
  schedule = "*/10 13-20 * * 1-5"
